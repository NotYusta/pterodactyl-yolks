name: build java graalvm
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - java/*graalvm/**
permissions:
  packages: write

jobs:
  push:
    name: "yolks:java_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GraalVM has no arm64 build for Java 8, so this one is amd64-only.
          - tag: 8_graalvm
            dir: 8graalvm
            platforms: linux/amd64
          - tag: 11_graalvm
            dir: 11graalvm
            platforms: linux/amd64,linux/arm64
          - tag: 16_graalvm
            dir: 16graalvm
            platforms: linux/amd64,linux/arm64
          - tag: 17_graalvm
            dir: 17graalvm
            platforms: linux/amd64,linux/arm64
          - tag: 21_graalvm
            dir: 21graalvm
            platforms: linux/amd64,linux/arm64
          - tag: 25_graalvm
            dir: 25graalvm
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: notyusta
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./java
          file: ./java/${{ matrix.dir }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/notyusta/yolks:java_${{ matrix.tag }}
