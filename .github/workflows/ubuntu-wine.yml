name: build ubuntu-wine
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - oses/ubuntu-wine/**
permissions:
  packages: write

jobs:
  push:
    name: "yolks:ubuntu-wine"
    runs-on: ubuntu-latest
    # amd64 only: the image ships wine32 (i386) and a 32-bit MySQL client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: notyusta
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./oses/ubuntu-wine
          file: ./oses/ubuntu-wine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/notyusta/yolks:ubuntu-wine
