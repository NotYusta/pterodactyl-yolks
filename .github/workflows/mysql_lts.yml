name: build mysql_lts
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - mysql_lts/**
permissions:
  packages: write

jobs:
  push:
    name: "yolks:mysql_lts_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - '8.4'
          - '9.7'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: notyusta
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./mysql_lts
          file: ./mysql_lts/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/notyusta/yolks:mysql_lts_${{ matrix.tag }}
